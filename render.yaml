services:
  - type: web
    name: triage-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
